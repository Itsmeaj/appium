name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build tools
        run: sudo apt-get install -y binutils dpkg-dev fakeroot rpm

      - name: Install locked dependencies
        run: corepack yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Verify release version and test package
        run: |
          node -e "const expected=process.env.GITHUB_REF_NAME.slice(1); const actual=require('./package.json').version; if (actual !== expected) throw new Error('Tag '+expected+' does not match package '+actual)"
          npm test
          npm run test:package

      - name: Build .deb (Ubuntu)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/deb/build-unified-installer.sh \
            --runtime-deb installers/stdspalinux-ubuntu_20_04.deb \
            --appium-spec appium@2.19.0 \
            --version "$VERSION"

      - name: Build .rpm (RHEL 10)
        env:
          UIMATE_ALLOW_CROSS_BUILD: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/rpm/build-unified-installer.sh \
            --el-major 10 \
            --runtime-lib native/dist/el10/libstdspalinux.so \
            --appium-spec appium@2.19.0 \
            --version "$VERSION"

      - name: Publish driver to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release and upload packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "dist/installers/uimate-appium-linux_${VERSION}_amd64.deb" \
            "dist/installers/uimate-appium-linux-${VERSION}-1.el10.x86_64.rpm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
